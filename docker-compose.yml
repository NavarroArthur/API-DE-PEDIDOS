x-app: &app
  build: .
  environment: &app-env
    MONGO_URI: mongodb://mongo:27017
    MONGO_DB: ecommerce
    RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    KAFKA_BOOTSTRAP: kafka:9092
    PROCESSAMENTO_DELAY: ${PROCESSAMENTO_DELAY:-2.0}
  depends_on:
    mongo:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    kafka:
      condition: service_healthy
  restart: unless-stopped

services:
  mongo:
    image: mongo:7
    container_name: pedidos-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: pedidos-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka em modo KRaft: o próprio broker é o controller, sem Zookeeper.
  kafka:
    image: apache/kafka:3.8.1
    container_name: pedidos-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  api:
    <<: *app
    container_name: pedidos-api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker-processamento:
    <<: *app
    container_name: pedidos-worker-processamento
    command: ["python", "-m", "app.workers.processamento"]

  worker-auditoria:
    <<: *app
    container_name: pedidos-worker-auditoria
    command: ["python", "-m", "app.workers.auditoria"]

volumes:
  mongo_data:
  kafka_data:
